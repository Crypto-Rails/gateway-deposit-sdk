name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 24.x bundles npm >= 11.5.1 (Trusted Publishing) already, so no
      # in-place `npm install -g npm@latest` — that self-update intermittently
      # corrupts the install and breaks publish with "Cannot find module 'sigstore'".

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build & test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
